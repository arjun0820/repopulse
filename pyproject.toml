[project]
name = "repopulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arjun", email = "arjunyakkanti2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.43.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
repopulse = "repopulse:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
markers = ["integration: needs the local Postgres running"]